name: Security

# Supplementary free scanners (all OSS, no GHAS/license needed on private repos).
# Semgrep/Bandit/Gitleaks/Trivy live in ci.yml; this file adds SCA, SBOM,
# Dockerfile lint, workflow security, IaC, supply-chain posture and secrets.
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: SCA (Syft SBOM + Grype)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Scan dependencies (Grype)
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          path: .
          severity-cutoff: high
          fail-build: false
          output-format: sarif
          output-file: grype.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-and-grype
          path: |
            sbom.cdx.json
            grype.sarif
          if-no-files-found: ignore

  hadolint:
    name: Dockerfile lint (Hadolint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          failure-threshold: error

  workflows:
    name: Workflow security (actionlint + zizmor)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false

  iac:
    name: IaC/config (Checkov)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          quiet: true
          soft_fail: true
          framework: dockerfile,secrets

  scorecard:
    name: Supply chain (OpenSSF Scorecard)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scorecard-action is a Docker action pulled from gcr.io, which now
      # requires billing for anonymous pulls. Use the CLI from GitHub releases.
      - name: Run Scorecard CLI
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          ver="5.6.0"
          curl -sSL "https://github.com/ossf/scorecard/releases/download/v${ver}/scorecard_${ver}_linux_amd64.tar.gz" | tar -xz scorecard
          ./scorecard --repo=github.com/${{ github.repository }} --format=json --show-details > scorecard.json
          python3 - <<'PY'
          import json
          d = json.load(open('scorecard.json'))
          print('overall score:', d.get('score'))
          for c in d.get('checks', []):
              print(f"  {c.get('name')}: {c.get('score')}")
          PY
          cat scorecard.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-json
          path: scorecard.json
          if-no-files-found: ignore

  trufflehog:
    name: Secret scan (TruffleHog)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          extra_args: --only-verified

  # --- Optional DAST ---------------------------------------------------------
  # Run against a live gateway (e.g. a staging Cloud Run URL) on demand:
