[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-types"
version = "0.1.0"
description = "Shared Pydantic v2 data models for PhishGuard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["src/py"]
