[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-backend"
version = "0.1.0"
description = "FastAPI Escalation Gateway for PhishGuard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "phishguard-types",
    "phishguard-ml-engine",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    "httpx>=0.25.0",
    "torchvision",
    "google-adk==2.12.0",
    "google-genai>=2.28.0,<3",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phishguard_backend.playground" = ["scenarios/*.json", "scenarios/*.jpg"]
